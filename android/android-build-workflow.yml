# Builds the Murimi ERP Android app (APK) on GitHub's servers.
# Runs when you push changes to the android/ folder, or by hand: Actions tab -> "Build Android app" -> Run workflow.
# Needs (repo Settings -> Secrets and variables -> Actions):
#   Variable  APP_HOST           e.g. promisetatenda.pythonanywhere.com
#   Secret    KEYSTORE_BASE64    contents of android-signing/murimi-erp-keystore.base64.txt
#   Secret    KEYSTORE_PASSWORD  from android-signing/KEY-INFO.txt
#   Secret    KEY_PASSWORD       from android-signing/KEY-INFO.txt
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check settings
        run: |
          if [ -z "${{ vars.APP_HOST }}" ]; then echo "::error::Add the APP_HOST variable (your website address) first."; exit 1; fi
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then echo "::error::Add the KEYSTORE_BASE64 secret first."; exit 1; fi

      - name: Unpack the signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/murimi.jks"

      - name: Build the APK
        working-directory: android
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          KEYSTORE_FILE: ${{ runner.temp }}/murimi.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: murimi
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk murimi-erp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: murimi-erp-apk-${{ github.run_number }}
          path: murimi-erp.apk
          retention-days: 90
